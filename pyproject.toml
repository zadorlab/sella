[project]
name = "sella"
dynamic = ["version"] # Let setuptools-scm manage version
description = "Saddle point optimization for molecular systems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0" }
authors = [
  { name = "Eric Hermes", email = "erichermes@gmail.com" },
  { name = "Daniel Levine", email = "levineds@gmail.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy >= 1.14.0",
  "scipy >= 1.1.0",
  "ase >= 3.22.0",
  "jax >= 0.4.20",
  "jaxlib >= 0.4.20",
]

[build-system]
requires = [
  "setuptools >= 74.1.0, < 82",
  "setuptools-scm >= 8.0",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sella*"]

[tool.setuptools_scm]
# Version will be determined from git tags
# Fallback version for when git is not available (e.g., in sdist)
fallback_version = "0.0.0"

[tool.uv.extra-build-dependencies]
sella = ["setuptools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
